<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>واقعیت افزوده</title><script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script><script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:sans-serif}.a-enter-vr,.a-enter-ar,.a-enter-vr-button,.a-orientation-modal,.a-modal{display:none!important;visibility:hidden!important;pointer-events:none!important}#infoBox{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:10000;background:#000b;color:white;padding:8px 18px;border-radius:20px;pointer-events:none}</style><script>AFRAME.registerComponent('force-show-model',{init:function(){this.el.addEventListener('model-loaded',()=>{const o=this.el.getObject3D('mesh');if(o)o.traverse(c=>{if(c.isMesh){c.frustumCulled=false;if(c.material){c.material.depthTest=true;c.material.depthWrite=true;c.material.needsUpdate=true}}})});this.el.addEventListener('model-error',()=>{const i=document.getElementById('infoBox');if(i)i.textContent='خطا در بارگذاری مدل؛ مسیر فایل را بررسی کنید.'})}});AFRAME.registerComponent('auto-rotator',{schema:{speed:{default:45}},tick:function(t,dt){if(!dt)return;const r=this.el.getAttribute('rotation');this.el.setAttribute('rotation',{x:r.x,y:r.y+this.data.speed*dt/1000,z:r.z})}});AFRAME.registerComponent('touch-rotator',{init:function(){let active=false,x=0,y=0;window.addEventListener('touchstart',e=>{if(e.touches.length===1){active=true;x=e.touches[0].clientX;y=e.touches[0].clientY}},{passive:true});window.addEventListener('touchmove',e=>{if(!active||e.touches.length!==1)return;const dx=e.touches[0].clientX-x,dy=e.touches[0].clientY-y,r=this.el.getAttribute('rotation');this.el.setAttribute('rotation',{x:r.x-dy*.4,y:r.y+dx*.4,z:r.z});x=e.touches[0].clientX;y=e.touches[0].clientY},{passive:true});window.addEventListener('touchend',()=>active=false)}});</script></head><body><div id="infoBox">📷 دوربین را روبروی تصویر تارگت بگیرید</div><a-scene mindar-image="imageTargetSrc: targets.mind; autoStart: true; uiScanning: no;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false"><a-camera position="0 0 0" look-controls="enabled: false"></a-camera><a-light type="ambient" intensity="2"></a-light><a-light type="directional" position="1 2 2" intensity="1.5"></a-light>
<a-entity mindar-image-target="targetIndex: 0"><a-entity position="0 0 0"><a-entity scale="0.5 0.5 0.5" rotation="0 0 0" auto-rotator="speed: 45" touch-rotator><a-gltf-model src="models/model1.glb" force-show-model></a-gltf-model></a-entity></a-entity></a-entity>
<a-entity mindar-image-target="targetIndex: 1"><a-entity position="0 0 0"><a-entity scale="0.5 0.5 0.5" rotation="0 0 0" auto-rotator="speed: 45" touch-rotator><a-gltf-model src="models/model2.glb" force-show-model></a-gltf-model></a-entity></a-entity></a-entity></a-scene><script>const s=document.querySelector('a-scene'),i=document.getElementById('infoBox');s.addEventListener('targetFound',()=>i.textContent='✨ مدل فعال شد');s.addEventListener('targetLost',()=>i.textContent='📷 دوربین را روبروی تصویر تارگت بگیرید');</script></body></html>
