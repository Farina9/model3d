<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نمایشگر سه‌بعدی</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { background: #080c14; color: #fff; width: 100vw; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
    header { position: absolute; top: 0; left: 0; right: 0; z-index: 10; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(180deg, rgba(8,12,20,0.85), transparent); }
    select { background: #151d30; color: #fff; border: 1px solid #3b82f6; padding: 8px 14px; border-radius: 8px; outline: none; font-size: 0.9rem; }
    model-viewer { width: 100%; height: 100%; }
    .controls { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 10px; }
    .btn { background: rgba(21, 29, 48, 0.85); backdrop-filter: blur(8px); border: 1px solid #263554; color: #fff; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; }
    .btn:hover { background: #3b82f6; }
    .btn-ar { background: #3b82f6; border: none; font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <h2 id="modelTitle">در حال بارگذاری...</h2>
    <select id="modelSelect"></select>
  </header>

  <model-viewer
    id="viewer"
    camera-controls
    min-camera-orbit="auto 0deg auto"
    max-camera-orbit="auto 180deg auto"
    interaction-prompt="none"
    ar
    ar-modes="webxr scene-viewer quick-look"
    shadow-intensity="1"
    exposure="1.2">
    <div class="controls">
      <button class="btn" id="toggleRotate">🔄 چرخش خودکار</button>
      <button class="btn" id="resetCam">🎯 ریست زاویه</button>
      <button slot="ar-button" class="btn btn-ar">📱 مشاهده در فضا (AR)</button>
    </div>
  </model-viewer>

  <script>
    const data = [
  {
    "title": "مدل اول",
    "fileName": "model1.glb",
    "scale": 1,
    "posX": 0,
    "posY": 0,
    "posZ": 0,
    "rotX": 0,
    "rotY": 0,
    "rotZ": 0,
    "manualRotate": true,
    "autoRotate": true,
    "autoRotateSpeed": 30
  },
  {
    "title": "مدل 2",
    "fileName": "model2.glb",
    "scale": 1,
    "posX": 0,
    "posY": 0,
    "posZ": 0,
    "rotX": 0,
    "rotY": 0,
    "rotZ": 0,
    "manualRotate": true,
    "autoRotate": true,
    "autoRotateSpeed": 30
  }
];
    const viewer = document.getElementById('viewer');
    const select = document.getElementById('modelSelect');
    const title = document.getElementById('modelTitle');

    data.forEach((m, idx) => {
      const opt = document.createElement('option');
      opt.value = idx;
      opt.textContent = m.title;
      select.appendChild(opt);
    });

    if (data.length <= 1) select.style.display = 'none';

    function setModel(idx) {
      const m = data[idx];
      if (!m) return;
      title.textContent = m.title;
      viewer.src = m.fileName.startsWith('http') ? m.fileName : 'models/' + m.fileName;
      viewer.scale = `${m.scale} ${m.scale} ${m.scale}`;
      viewer.setAttribute('camera-target', `${m.posX}m ${m.posY}m ${m.posZ}m`);
      viewer.orientation = `${m.rotX}deg ${m.rotY}deg ${m.rotZ}deg`;

      if (m.manualRotate) {
        viewer.setAttribute('camera-controls', '');
      } else {
        viewer.removeAttribute('camera-controls');
      }

      if (m.autoRotate) {
        viewer.setAttribute('auto-rotate', '');
        viewer.setAttribute('rotation-per-second', `${m.autoRotateSpeed}deg`);
      } else {
        viewer.removeAttribute('auto-rotate');
      }
    }

    select.addEventListener('change', e => setModel(parseInt(e.target.value)));
    document.getElementById('toggleRotate').addEventListener('click', () => {
      viewer.hasAttribute('auto-rotate') ? viewer.removeAttribute('auto-rotate') : viewer.setAttribute('auto-rotate', '');
    });
    document.getElementById('resetCam').addEventListener('click', () => {
      viewer.cameraOrbit = '0deg 75deg 105%';
    });

    if (data.length > 0) setModel(0);
  </script>
</body>
</html>
