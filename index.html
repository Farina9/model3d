<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WebAR</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    /* حذف کامل دکمه‌های VR و رابط‌های مزاحم */
    .a-enter-vr, .a-enter-ar, .a-orientation-modal, .a-modal, #a-scene-container { display: none !important; visibility: hidden !important; }
    body { margin: 0; padding: 0; overflow: hidden; }
  </style>
  <script>
    AFRAME.registerComponent("auto-turn", { schema: { speed: { default: 40 } }, tick: function (t, dt) { if (!dt) return; const rot = this.el.getAttribute("rotation"); this.el.setAttribute("rotation", {x: rot.x, y: rot.y + (this.data.speed * dt) / 1000, z: rot.z}); } });
    AFRAME.registerComponent("touch-turn", { init: function () { let isTouching = false, startX = 0, startY = 0; window.addEventListener("touchstart", (e) => { if(e.touches.length===1) { isTouching=true; startX=e.touches[0].clientX; startY=e.touches[0].clientY; } }, {passive:true}); window.addEventListener("touchmove", (e) => { if(!isTouching || e.touches.length!==1) return; const dx = e.touches[0].clientX - startX, dy = e.touches[0].clientY - startY, rot = this.el.getAttribute("rotation"); this.el.setAttribute("rotation", {x: rot.x - dy * 0.35, y: rot.y + dx * 0.35, z: rot.z}); startX=e.touches[0].clientX; startY=e.touches[0].clientY; }, {passive:true}); window.addEventListener("touchend", () => isTouching=false); } });
  </script>
</head>
<body>
  <a-scene mindar-image="imageTargetSrc: ./targets.mind;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    
    <a-entity mindar-image-target="targetIndex: 0">
      <a-entity position="0 0 0.1" rotation="0 0 0" scale="0.75 0.75 0.75" auto-turn="speed: 40" touch-turn>
        <a-gltf-model src="models/model1.glb"></a-gltf-model>
      </a-entity>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 1">
      <a-entity position="0 0 0.1" rotation="0 0 0" scale="0.75 0.75 0.75" auto-turn="speed: 40" touch-turn>
        <a-gltf-model src="models/model2.glb"></a-gltf-model>
      </a-entity>
    </a-entity>
  </a-scene>
</body>
</html>
