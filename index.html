<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>نمایش واقعیت افزوده</title>
  
  <!-- A-Frame و MindAR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
    
    /* مخفی‌سازی کامل دکمه VR و UIهای پیش‌فرض A-Frame */
    .a-enter-vr, .a-enter-ar, .a-orientation-modal { display: none !important; }

    #infoBox {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99999;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 0.88rem;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.15);
      white-space: nowrap;
      pointer-events: none;
    }

    #targetFrame {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 260px;
      height: 260px;
      transform: translate(-50%, -50%);
      border: 2px dashed rgba(255, 255, 255, 0.6);
      border-radius: 20px;
      z-index: 9999;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 0.85rem;
      background: rgba(255,255,255,0.02);
    }
  </style>

  <script>
    // اطمینان از تنظیم متریال و سایه مدل پس از لود شدن
    AFRAME.registerComponent('model-loader', {
      init: function () {
        this.el.addEventListener('model-loaded', () => {
          const obj = this.el.getObject3D('mesh');
          if (obj) {
            obj.traverse((node) => {
              if (node.isMesh) {
                node.castShadow = true;
                node.receiveShadow = true;
                if (node.material) {
                  node.material.needsUpdate = true;
                  node.material.depthWrite = true;
                }
              }
            });
          }
        });
      }
    });

    // چرخش خودکار استاندارد بر پایه تیک رندرینگ
    AFRAME.registerComponent('auto-rotator', {
      schema: { speed: { default: 45 } },
      tick: function (time, delta) {
        if (!delta) return;
        const rot = this.el.getAttribute('rotation');
        this.el.setAttribute('rotation', {
          x: rot.x,
          y: rot.y + (this.data.speed * delta) / 1000,
          z: rot.z
        });
      }
    });

    // چرخش لمسی ۳۶۰ درجه
    AFRAME.registerComponent('touch-rotator', {
      init: function () {
        let isTouching = false;
        let lastX = 0;
        let lastY = 0;

        window.addEventListener('touchstart', (e) => {
          if (e.touches.length === 1) {
            isTouching = true;
            lastX = e.touches[0].clientX;
            lastY = e.touches[0].clientY;
          }
        });

        window.addEventListener('touchmove', (e) => {
          if (!isTouching || e.touches.length !== 1) return;
          const deltaX = e.touches[0].clientX - lastX;
          const deltaY = e.touches[0].clientY - lastY;

          const rot = this.el.getAttribute('rotation');
          this.el.setAttribute('rotation', {
            x: rot.x - deltaY * 0.4,
            y: rot.y + deltaX * 0.4,
            z: rot.z
          });

          lastX = e.touches[0].clientX;
          lastY = e.touches[0].clientY;
        });

        window.addEventListener('touchend', () => { isTouching = false; });
      }
    });
  </script>
</head>
<body>

  <div id="infoBox">📷 دوربین را روبروی تصویر تارگت بگیرید</div>
  <div id="targetFrame">کادر اسکن عکس</div>

  <a-scene 
    mindar-image="imageTargetSrc: targets.mind; autoStart: true; uiScanning: no;" 
    color-space="sRGB" 
    embedded
    renderer="colorManagement: true, physicallyCorrectLights: true" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets timeout="10000">
      <a-asset-item id="asset-1" src="models/model1.glb"></a-asset-item>
      <a-asset-item id="asset-1790932481042" src="models/model2.glb"></a-asset-item>
      
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    
    <!-- سیستم نورپردازی جامع برای جلوگیری از سیاه یا تاریک شدن مدل -->
    <a-light type="ambient" intensity="1.5"></a-light>
    <a-light type="directional" position="0 2 2" intensity="1.8"></a-light>
    <a-light type="directional" position="0 -2 -2" intensity="0.8"></a-light>

    
      <!-- تارگت 0 -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-entity 
          position="0 0 0.1" 
          rotation="0 0 0" 
          scale="0.3 0.3 0.3"
          auto-rotator="speed: 45"
          touch-rotator>
          <a-gltf-model src="#asset-1" model-loader></a-gltf-model>
        </a-entity>
      </a-entity>
        
      <!-- تارگت 1 -->
      <a-entity mindar-image-target="targetIndex: 1">
        <a-entity 
          position="0 0 0.1" 
          rotation="0 0 0" 
          scale="0.3 0.3 0.3"
          auto-rotator="speed: 45"
          touch-rotator>
          <a-gltf-model src="#asset-1790932481042" model-loader></a-gltf-model>
        </a-entity>
      </a-entity>
        

  </a-scene>

  <script>
    const sceneEl = document.querySelector('a-scene');
    const infoBox = document.getElementById('infoBox');
    const targetFrame = document.getElementById('targetFrame');

    sceneEl.addEventListener('targetFound', () => {
      targetFrame.style.display = 'none';
      infoBox.textContent = '✨ مدل فعال شد';
    });

    sceneEl.addEventListener('targetLost', () => {
      targetFrame.style.display = 'flex';
      infoBox.textContent = '📷 دوربین را روبروی تصویر تارگت بگیرید';
    });
  </script>
</body>
</html>
