<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>WebAR</title>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    a-scene { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
<a-scene
  mindar-image="imageTargetSrc: targets.mind; autoStart: true; uiLoading: yes; uiScanning: yes; uiError: yes;"
  color-space="sRGB"
  renderer="colorManagement:true;physicallyCorrectLights:true;antialias:true"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
>
  <a-assets>
    <a-asset-item id="asset-model1_glb" src="model1.glb"></a-asset-item>
    <a-asset-item id="asset-model2_glb" src="model2.glb"></a-asset-item>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

  <!-- مدل 1 (روی عکس 1) | target 0 -->
  <a-entity mindar-image-target="targetIndex: 0">
    <a-entity
      position="0 0 0"
      rotation="0 0 0"
      scale="0.75 0.75 0.75"
      auto-rotate="speed:45"
      touch-rotate="speed:0.4"
    >
      <a-gltf-model src="#asset-model1_glb" animation-mixer></a-gltf-model>
    </a-entity>
  </a-entity>

  <!-- مدل 2 (روی عکس 2) | target 1 -->
  <a-entity mindar-image-target="targetIndex: 1">
    <a-entity
      position="0 0 0"
      rotation="0 0 0"
      scale="0.75 0.75 0.75"
      auto-rotate="speed:45"
      touch-rotate="speed:0.4"
    >
      <a-gltf-model src="#asset-model2_glb" animation-mixer></a-gltf-model>
    </a-entity>
  </a-entity>
</a-scene>

<script>
/* ── Auto-rotate component ── */
AFRAME.registerComponent('auto-rotate', {
  schema: { speed: { type: 'number', default: 45 } },
  tick(t, dt) {
    this.el.object3D.rotation.y += THREE.MathUtils.degToRad(this.data.speed * dt / 1000);
  }
});

/* ── Touch-rotate component ── */
AFRAME.registerComponent('touch-rotate', {
  schema: { speed: { type: 'number', default: 0.4 } },
  init() {
    this._onTouchStart = this.onTouchStart.bind(this);
    this._onTouchMove  = this.onTouchMove.bind(this);
    window.addEventListener('touchstart', this._onTouchStart, { passive: true });
    window.addEventListener('touchmove',  this._onTouchMove,  { passive: true });
    this.lastX = 0;
    this.touching = false;
  },
  remove() {
    window.removeEventListener('touchstart', this._onTouchStart);
    window.removeEventListener('touchmove',  this._onTouchMove);
  },
  onTouchStart(e) {
    this.touching = true;
    this.lastX = e.touches[0].clientX;
  },
  onTouchMove(e) {
    if (!this.touching) return;
    const dx = e.touches[0].clientX - this.lastX;
    this.el.object3D.rotation.y += THREE.MathUtils.degToRad(dx * this.data.speed);
    this.lastX = e.touches[0].clientX;
  }
});
</script>
</body>
</html>
