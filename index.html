<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>نمایشگر واقعیت افزوده MindAR</title>
  <!-- کتابخانه‌های مورد نیاز MindAR و A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
  </style>

  <script>
    // کامپوننت چرخش خودکار بر اساس تنظیمات پنل
    AFRAME.registerComponent('auto-rotate', {
      schema: {
        axis: { type: 'string', default: 'y' },
        speed: { type: 'number', default: 1 }
      },
      tick: function () {
        const rot = this.el.getAttribute('rotation');
        rot[this.data.axis] += this.data.speed;
        this.el.setAttribute('rotation', rot);
      }
    });

    // کامپوننت چرخش همه‌جانبه دستی با تاچ یا کشیدن ماوس
    AFRAME.registerComponent('gesture-rotation', {
      init: function () {
        this.handleTouchMove = this.handleTouchMove.bind(this);
        this.handleTouchStart = this.handleTouchStart.bind(this);
        this.handleTouchEnd = this.handleTouchEnd.bind(this);

        this.touchStartX = 0;
        this.touchStartY = 0;
        this.isDragging = false;

        window.addEventListener('touchstart', this.handleTouchStart, { passive: false });
        window.addEventListener('touchmove', this.handleTouchMove, { passive: false });
        window.addEventListener('touchend', this.handleTouchEnd);

        // پشتیبانی از ماوس برای بررسی در کامپیوتر
        window.addEventListener('mousedown', (e) => {
          this.isDragging = true;
          this.touchStartX = e.clientX;
          this.touchStartY = e.clientY;
        });
        window.addEventListener('mousemove', (e) => {
          if (!this.isDragging) return;
          const deltaX = e.clientX - this.touchStartX;
          const deltaY = e.clientY - this.touchStartY;
          const rot = this.el.getAttribute('rotation');
          this.el.setAttribute('rotation', {
            x: rot.x + deltaY * 0.4,
            y: rot.y + deltaX * 0.4,
            z: rot.z
          });
          this.touchStartX = e.clientX;
          this.touchStartY = e.clientY;
        });
        window.addEventListener('mouseup', () => { this.isDragging = false; });
      },
      handleTouchStart: function (e) {
        if (e.touches.length === 1) {
          this.touchStartX = e.touches[0].clientX;
          this.touchStartY = e.touches[0].clientY;
          this.isDragging = true;
        }
      },
      handleTouchMove: function (e) {
        if (!this.isDragging || e.touches.length !== 1) return;
        const deltaX = e.touches[0].clientX - this.touchStartX;
        const deltaY = e.touches[0].clientY - this.touchStartY;
        const rot = this.el.getAttribute('rotation');
        this.el.setAttribute('rotation', {
          x: rot.x + deltaY * 0.4,
          y: rot.y + deltaX * 0.4,
          z: rot.z
        });
        this.touchStartX = e.touches[0].clientX;
        this.touchStartY = e.touches[0].clientY;
      },
      handleTouchEnd: function () {
        this.isDragging = false;
      }
    });
  </script>
</head>
<body>
  <!-- صحنه واقعیت افزوده متصل به فایل targets.mind -->
  <a-scene 
    mindar-image="imageTargetSrc: targets.mind; filterMinCF:0.0001; filterBeta: 0.001;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    
    <!-- تارگت شماره 0 -->
    <a-entity mindar-image-target="targetIndex: 0">
      <a-entity id="model-wrapper-0"
                position="0 0 0"
                rotation="0 0 0"
                scale="1.5 1.5 1.5"
                auto-rotate="axis: y; speed: 1"
                gesture-rotation>
        <a-gltf-model src="models/model1.glb"></a-gltf-model>
      </a-entity>
    </a-entity>

    <!-- تارگت شماره 1 -->
    <a-entity mindar-image-target="targetIndex: 1">
      <a-entity id="model-wrapper-1"
                position="0 0 0"
                rotation="0 0 0"
                scale="1.5 1.5 1.5"
                auto-rotate="axis: y; speed: 1"
                gesture-rotation>
        <a-gltf-model src="models/model2.glb"></a-gltf-model>
      </a-entity>
    </a-entity>

  </a-scene>
</body>
</html>
