<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>واقعیت افزوده مبتنی بر عکس (WebAR)</title>
  
  <!-- A-Frame و موتور ردیابی تصویر MindAR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: sans-serif; }
    
    #overlay {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 1000;
      text-align: center;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      padding: 10px 16px;
      border-radius: 12px;
      backdrop-filter: blur(8px);
      font-size: 0.9rem;
      pointer-events: none;
    }

    #scanBox {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 250px;
      height: 250px;
      transform: translate(-50%, -50%);
      border: 2px dashed rgba(255,255,255,0.4);
      border-radius: 18px;
      pointer-events: none;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.7);
      font-size: 0.85rem;
    }
  </style>

  <script>
    // کامپوننت چرخش دستی با لمس انگشت (Gesture Handler)
    AFRAME.registerComponent('gesture-handler', {
      schema: { enabled: { default: true } },
      init: function () {
        this.touchStartX = 0;
        this.touchStartY = 0;
        this.isMoving = false;

        window.addEventListener('touchstart', (e) => {
          if (e.touches.length === 1) {
            this.touchStartX = e.touches[0].clientX;
            this.touchStartY = e.touches[0].clientY;
            this.isMoving = true;
          }
        });

        window.addEventListener('touchmove', (e) => {
          if (!this.isMoving || e.touches.length !== 1) return;
          const deltaX = e.touches[0].clientX - this.touchStartX;
          const deltaY = e.touches[0].clientY - this.touchStartY;

          const currentRot = this.el.getAttribute('rotation') || { x: 0, y: 0, z: 0 };
          this.el.setAttribute('rotation', {
            x: currentRot.x + deltaY * 0.5,
            y: currentRot.y + deltaX * 0.5,
            z: currentRot.z
          });

          this.touchStartX = e.touches[0].clientX;
          this.touchStartY = e.touches[0].clientY;
        });

        window.addEventListener('touchend', () => { this.isMoving = false; });
      }
    });
  </script>
</head>
<body>

  <div id="overlay">📷 دوربین را روبروی عکس تارگت بگیرید</div>
  <div id="scanBox">کادر تارگت</div>

  <!-- صحنه واقعیت افزوده متصل به فایل تارگت targets.mind -->
  <a-scene 
    mindar-image="imageTargetSrc: targets.mind; autoStart: true; uiScanning: no;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    
    <a-light type="ambient" intensity="1.2"></a-light>
    <a-light type="directional" position="1 2 1" intensity="1.5"></a-light>

    
      <!-- تارگت عکس شماره 0 -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model 
          id="target-model-1"
          class="cantap gesture-handler"
          src="models/model1.glb" 
          position="0 0 0" 
          rotation="0 0 0" 
          scale="0.75 0.75 0.75"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
        </a-gltf-model>
      </a-entity>
        
      <!-- تارگت عکس شماره 1 -->
      <a-entity mindar-image-target="targetIndex: 1">
        <a-gltf-model 
          id="target-model-1790931878218"
          class="cantap gesture-handler"
          src="models/model2.glb" 
          position="0 0 0" 
          rotation="0 0 0" 
          scale="0.75 0.75 0.75"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
        </a-gltf-model>
      </a-entity>
        

  </a-scene>

  <script>
    // پنهان کردن کادر راهنما پس از تشخیص عکس
    const sceneEl = document.querySelector('a-scene');
    const scanBox = document.getElementById('scanBox');
    const overlay = document.getElementById('overlay');

    sceneEl.addEventListener('targetFound', () => {
      if (scanBox) scanBox.style.display = 'none';
      if (overlay) overlay.textContent = '✨ مدل بارگذاری شد';
    });

    sceneEl.addEventListener('targetLost', () => {
      if (scanBox) scanBox.style.display = 'flex';
      if (overlay) overlay.textContent = '📷 دوربین را روبروی عکس تارگت بگیرید';
    });
  </script>
</body>
</html>
